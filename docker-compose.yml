version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mediarate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediarate
      POSTGRES_PASSWORD: mediarate_dev
      POSTGRES_DB: mediarate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediarate"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mediarate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
