version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mediarate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediarate
      POSTGRES_PASSWORD: mediarate_dev
      POSTGRES_DB: mediarate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediarate"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mediarate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  minio_data:

  # MinIO: S3-compatível para armazenamento de uploads (dev local)
  minio:
    image: minio/minio:latest
    container_name: mediarate-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mediarate
      MINIO_ROOT_PASSWORD: mediarate_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  minio_data:
