                - paragraph [ref=e430]: O plano Free oferece catálogo limitado e MEDIA Score básico. O plano Plus (R$ 4,90/mês) desbloqueia catálogo completo, watchlist ilimitada e recomendações IA. O Premium (R$ 9,90/mês) adiciona perfil de gosto avançado, listas personalizadas e suporte prioritário.
              - generic [ref=e431]:
                - heading "Benefícios exclusivos para assinantes" [level=3] [ref=e432]
                - paragraph [ref=e433]: Assinantes Plus e Premium têm acesso ao catálogo completo, recomendações personalizadas por IA, exportação de dados e suporte prioritário.
              - generic [ref=e434]:
