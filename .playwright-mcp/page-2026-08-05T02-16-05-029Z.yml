        - generic [ref=e373]:
          - generic [ref=e374]:
            - heading "O que é o MEDIA Rate" [level=2] [ref=e375]
            - generic [ref=e376]:
              - generic [ref=e377]:
                - heading "Proposta de valor da plataforma" [level=3] [ref=e378]
                - paragraph [ref=e379]: O MEDIA Rate é a primeira plataforma brasileira de score unificado para filmes, séries e games. Consolidamos avaliações de múltiplas fontes públicas em uma única nota transparente, eliminando a necessidade de consultar vários sites para decidir o que assistir ou jogar.
              - generic [ref=e380]:
                - heading "Diferença entre agregador de notas e resenha única" [level=3] [ref=e381]
                - paragraph [ref=e382]: Diferente de um site de críticas tradicional, onde uma única pessoa avalia subjetivamente, o MEDIA Rate agrega milhares de avaliações com peso estatístico. Cada nota reflete a média ponderada da crítica especializada e do público, com transparência total sobre as fontes utilizadas.
              - generic [ref=e383]:
                - heading "Categorias de mídia cobertas" [level=3] [ref=e384]
                - paragraph [ref=e385]: Filmes, séries e games são o foco atual. Animes são cobertos como gênero dentro de Séries. Livros, animes e quadrinhos como categorias próprias estão no roadmap e chegarão em atualizações futuras.
          - generic [ref=e386]:
            - heading "Como Funciona o MEDIA Score™" [level=2] [ref=e387]
            - generic [ref=e388]:
              - generic [ref=e389]:
                - heading "Metodologia de cálculo" [level=3] [ref=e390]
                - paragraph [ref=e391]: "O MEDIA Score™ v3 calcula a nota por mídia com pesos específicos para crítica, público e consenso (ex.: filmes 40/40/20) e aplica um estimador Bayesiano que puxa obras com poucos votos para a média do catálogo. O consenso realimenta a nota e o nível de confiança é exibido com transparência."
              - generic [ref=e392]:
                - heading "Fontes de dados e normalização das notas" [level=3] [ref=e393]
                - paragraph [ref=e394]: Utilizamos TMDB, OpenCritic, IGDB e Steam como fontes primárias. Cada nota bruta é normalizada para a escala 0–100, aplicando limites mínimos de votos e detecção de outliers para garantir qualidade estatística. Fontes abaixo do limiar ou com desvio extremo são excluídas e documentadas com o motivo.
              - generic [ref=e395]:
                - heading "Fontes e Cobertura de Dados" [level=3] [ref=e396]
                - paragraph [ref=e397]: "O MEDIA Rate integra fontes por tipo de mídia: TMDB (filmes e séries), TVMaze (séries), OpenCritic e IGDB (games), Steam (games). A cobertura varia por tipo — filmes têm a base mais ampla; jogos dependem da disponibilidade de dados abertos. Os dados são atualizados periodicamente conforme as APIs das fontes."
              - generic [ref=e398]:
                - heading "Nível de confiança e transparência do score" [level=3] [ref=e399]
                - paragraph [ref=e400]: Cada MEDIA Score™ exibe um indicador de confiança (Alta / Média / Baixa), calculado com base no volume de votos, número de fontes, dispersão das notas e idade dos dados. Scores com baixa confiança são sinalizados com alerta visual, nunca ocultados.
          - generic [ref=e401]:
            - heading "Catálogo de Filmes, Séries e Games" [level=2] [ref=e402]
            - generic [ref=e403]:
              - generic [ref=e404]:
                - heading "Navegação por categoria e gênero" [level=3] [ref=e405]
                - paragraph [ref=e406]: O catálogo do MEDIA Rate permite filtrar por tipo de mídia (Filmes, Séries, Games), gênero, ano de lançamento e ordenar por score, título ou data. A página de catálogo exibe cards com poster, título, ano e MEDIA Score™.
              - generic [ref=e407]:
                - heading "Ficha técnica de cada título" [level=3] [ref=e408]
                - paragraph [ref=e409]: "Cada título possui uma página de detalhe com: poster, sinopse, elenco, gêneros, ano de lançamento, plataformas de streaming, MEDIA Score™ detalhado (Gauge + Barra de crítica vs público), fontes de avaliação e classificação indicativa por região."
              - generic [ref=e410]:
                - heading "Temporadas e episódios de séries" [level=3] [ref=e411]
                - paragraph [ref=e412]: Séries possuem navegação por temporadas (abas horizontais) e episódios (lista expansível). Cada episódio pode ter seu próprio score quando disponível.
          - generic [ref=e413]:
            - heading "Busca e Descoberta de Títulos" [level=2] [ref=e414]
            - generic [ref=e415]:
              - generic [ref=e416]:
                - heading "Busca rápida e autocomplete" [level=3] [ref=e417]
                - paragraph [ref=e418]: A barra de busca com atalho Ctrl+K permite encontrar qualquer título instantaneamente. Resultados incluem score, tipo e ano, com navegação direta para a página de detalhe.
              - generic [ref=e419]:
                - heading "Filtros, ordenação e tags" [level=3] [ref=e420]
                - paragraph [ref=e421]: No catálogo e na página Discover, você pode filtrar por tipo de mídia, ordenar por score (maior/menor), ano ou título, e buscar por palavra-chave.
              - generic [ref=e422]:
                - heading "Recomendações personalizadas" [level=3] [ref=e423]
                - paragraph [ref=e424]: Com base no seu perfil de gosto e histórico, o MEDIA Rate sugere títulos similares aos que você já avaliou ou adicionou à watchlist.
          - generic [ref=e425]:
            - heading "Planos e Assinatura" [level=2] [ref=e426]
            - generic [ref=e427]:
              - generic [ref=e428]:
                - heading "Comparativo dos planos Free, Plus e Premium" [level=3] [ref=e429]
                - paragraph [ref=e430]: O plano Free oferece catálogo limitado e MEDIA Score básico. O plano Plus (R$ 4,90/mês) desbloqueia catálogo completo, watchlist ilimitada e recomendações IA. O Premium (R$ 9,90/mês) adiciona perfil de gosto avançado, listas personalizadas e suporte prioritário.
              - generic [ref=e431]:
                - heading "Benefícios exclusivos para assinantes" [level=3] [ref=e432]
                - paragraph [ref=e433]: Assinantes Plus e Premium têm acesso ao catálogo completo, recomendações personalizadas por IA, exportação de dados e suporte prioritário.
              - generic [ref=e434]:
                - heading "Upgrade, downgrade e cancelamento" [level=3] [ref=e435]
                - paragraph [ref=e436]: Você pode alterar seu plano a qualquer momento. O cancelamento é imediato, sem multas ou aviso prévio.
          - generic [ref=e437]:
            - heading "Conta, Cadastro e Personalização" [level=2] [ref=e438]
            - generic [ref=e439]:
              - generic [ref=e440]:
                - heading "Como criar uma conta gratuita" [level=3] [ref=e441]
                - paragraph [ref=e442]: Clique em "Cadastre-se" no canto superior direito, preencha nome, e-mail e senha. Sua conta Free é criada instantaneamente — sem necessidade de cartão de crédito.
              - generic [ref=e443]:
                - heading "Favoritos, watchlist e histórico" [level=3] [ref=e444]
                - paragraph [ref=e445]: "Adicione qualquer título à sua watchlist com um clique. Organize em colunas: Quero Ver, Vendo, Vi. Acompanhe seu histórico e estatísticas pessoais no Dashboard."
              - generic [ref=e446]:
                - heading "Privacidade e proteção de dados (LGPD)" [level=3] [ref=e447]
                - paragraph [ref=e448]:
                  - text: Seus dados são protegidos conforme a LGPD. Consulte nossa
                  - link "Política de Privacidade" [ref=e449] [cursor=pointer]:
                    - /url: /pt-BR/privacy
                  - text: .
          - generic [ref=e450]:
            - heading "Idiomas e Acesso Internacional" [level=2] [ref=e451]
            - generic [ref=e452]:
              - generic [ref=e453]:
                - heading "Idiomas disponíveis" [level=3] [ref=e454]
                - paragraph [ref=e455]:
                  - text: "O MEDIA Rate está disponível em três idiomas:"
                  - link "Português (Brasil)" [ref=e456] [cursor=pointer]:
                    - /url: /pt-BR
                  - text: ","
                  - link "Inglês (EUA)" [ref=e457] [cursor=pointer]:
                    - /url: /en-US
                  - text: e
                  - link "Espanhol (Espanha)" [ref=e458] [cursor=pointer]:
                    - /url: /es-ES
                  - text: .
              - generic [ref=e459]:
                - heading "Como alterar o idioma da plataforma" [level=3] [ref=e460]
                - paragraph [ref=e461]: Use o seletor de idioma no canto superior direito (ícone de globo) para alternar entre Português, Inglês e Espanhol. A troca é instantânea e preserva a página atual.
              - generic [ref=e462]:
                - heading "SEO multilíngue e experiência localizada" [level=3] [ref=e463]
                - paragraph [ref=e464]: Cada idioma possui URLs canônicas, metadados e conteúdo localizados, garantindo indexação correta nos buscadores e uma experiência totalmente adaptada à sua região.
          - generic [ref=e465]:
            - heading "Perguntas Frequentes" [level=2] [ref=e466]
            - generic [ref=e467]:
              - generic [ref=e468]:
                - heading "O que é o MEDIA Score™ e como ele é calculado?" [level=3] [ref=e469]
                - paragraph [ref=e470]: O MEDIA Score™ consolida avaliações de fontes como IMDb, Rotten Tomatoes, TMDB, Metacritic, IGDB e OpenLibrary em uma nota única por mídia — jogos de 0 a 100, demais mídias de 0 a 10 — com indicador de confiança (alta/média/baixa).
              - generic [ref=e471]:
                - heading "Preciso de conta para usar o MEDIA Rate?" [level=3] [ref=e472]
                - paragraph [ref=e473]: Não. O catálogo, busca e MEDIA Score™ são gratuitos. Recomendações ilimitadas, perfil de gosto e assistente IA exigem plano Plus ou Premium.
              - generic [ref=e474]:
                - heading "Posso cancelar minha assinatura quando quiser?" [level=3] [ref=e475]
                - paragraph [ref=e476]: Sim. Todos os planos pagos podem ser cancelados a qualquer momento, sem multa ou aviso prévio.
              - generic [ref=e477]:
                - heading "Posso mudar de plano depois?" [level=3] [ref=e478]
                - paragraph [ref=e479]: Sim. Você pode fazer upgrade ou downgrade a qualquer momento. O valor é ajustado proporcionalmente.
              - generic [ref=e480]:
                - heading "O MEDIA Score é uma crítica?" [level=3] [ref=e481]
                - paragraph [ref=e482]: Não. O MEDIA Score™ é um indicador consolidado de sinais de avaliação de fontes públicas — não é uma crítica nem opinião editorial. Ele deve ser usado como ponto de partida para descoberta, não como substituto de uma análise individual.
              - generic [ref=e483]:
                - heading "Quais fontes de avaliação vocês usam?" [level=3] [ref=e484]
                - paragraph [ref=e485]: Utilizamos IMDb, Rotten Tomatoes e TMDB para filmes e séries; IGDB e OpenCritic para games.
            - paragraph [ref=e486]:
              - link "FAQ completo dos planos →" [ref=e487] [cursor=pointer]:
                - /url: /pt-BR/pricing#faq
