repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key

  - repo: local
    hooks:
      - id: conventional-commit-guard
        name: Conventional Commit Guard
        entry: python3 .kilo/hooks/conventional-commit-guard.py
        language: system
        stages: [commit-msg]
        pass_filenames: false

      - id: danger-guard
        name: Danger Guard
        entry: python3 .kilo/hooks/danger-guard.py
        language: system
        stages: [pre-commit]
        pass_filenames: false
