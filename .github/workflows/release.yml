name: Release

on:
  push:
    branches: [main]

# Zero Trust Global
permissions: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Necessário para Changesets criar PRs e Releases
      pull-requests: write # Necessário para Changesets abrir o PR de versão
      id-token: write      # OBRIGATÓRIO para OIDC Federation com o npm (Trusted Publishers)
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          # O node-auth-token NÃO é definido aqui. O OIDC do GitHub assumirá a autenticação.

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm turbo run build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN não é necessário quando usando Trusted Publishers (OIDC)