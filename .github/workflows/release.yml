name: Release

# T046/D-541: era `on: push: branches:[main]`, mas o job SEMPRE falhava
# (`npm run build` não existe na raiz do monorepo) e, uma vez corrigido, passaria
# a publicar um Release + tag (`v<run_number>`) a cada merge — comportamento não
# decidido pelo Operador. Por isso o disparo virou MANUAL: elimina o ruído
# crônico na main sem publicar nada e mantém a automação disponível.
on:
  workflow_dispatch:

permissions: {}
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Packages
        # T046: a raiz do monorepo não tem script `build` (só apps/web e apps/api).
        # `--if-present` elimina a falha crônica; nada é construído na raiz.
        run: npm run build --if-present

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
