# GitHub Actions CI — MEDIA Rate (T9.1/T9.2/T8.3/T8.4/T8.5)
#
# Pipeline com stages paralelos: lint+audit | test+coverage | build | Semgrep | ZAP | Stryker
# Cache de npm para acelerar builds subsequentes.
# Artefatos: coverage report, build output, test results.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # T462/D-503: validação manual (ex.: conferir o passo de sourcemaps do
  # Sentry sem depender de PR/merge).
  workflow_dispatch:

# T459/D-457: o `paths-ignore` foi MOVIDO do nível de workflow para o nível de
# job (job `changes` + `if` nos jobs pesados). Motivo: paths-ignore de workflow
# impedia os checks REQUERIDOS do ruleset protect-main de rodar em PR
# só-de-docs → deadlock que forçava bypass de branch protection. Agora os jobs
# pesados pulam docs-only (economia D-382 mantida) e o job leve `docs-gate`
# SEMPRE roda (check requerido), permitindo merge de docs SEM bypass.

# D-382: um run por ref — cancela runs supersedadas do mesmo ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

env:
  NODE_VERSION: "20"

jobs:

  # T459/D-457: detecta se há mudança de CÓDIGO (fora de docs/markdown). Os jobs
  # pesados dependem disto; em docs-only eles pulam (economia D-382 mantida).
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Filtra arquivos de código
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          e2e=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|*.md|.claude/*|docs/screenshots/*) ;;
              *) code=true ;;
            esac
            # T061/D-548: só roda o job E2E FULL quando muda infra de E2E/evidence/CI.
            case "$f" in
              apps/web/e2e/*|scripts/evidence-local.mjs|scripts/ci/evidence-guard*.mjs|apps/web/playwright.config.ts|.github/workflows/ci.yml) e2e=true ;;
            esac
          done <<< "$(git diff --name-only "$base" "$head")"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "code=$code"; echo "e2e=$e2e"

  # T459/D-457: gate LEVE que SEMPRE roda (inclusive PR só-de-docs). É o check
  # requerido que destrava o merge de docs sem bypass; os jobs pesados pulam.
  docs-gate:
    name: Docs Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Arquivos alterados
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            git ls-files > /tmp/changed.txt
          else
            git diff --name-only "$base" "$head" > /tmp/changed.txt
          fi
          echo "--- alterados ---"; cat /tmp/changed.txt
      - name: Secret scan (padrões óbvios)
        run: |
          found=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if grep -nEI 'sk_live_[A-Za-z0-9]|sk_test_[A-Za-z0-9]|whsec_[A-Za-z0-9]|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY' "$f"; then
              echo "::error::Padrão de segredo em $f"; found=1
            fi
          done < /tmp/changed.txt
          [ "$found" = "0" ] || exit 1
          echo "docs-gate: sem padrões de segredo."
      - name: Markdown sanity (não-vazio)
        run: |
          fail=0
          while IFS= read -r f; do
            case "$f" in
              *.md)
                [ -f "$f" ] || continue
                if [ ! -s "$f" ]; then echo "::error::Markdown vazio: $f"; fail=1; fi
                ;;
            esac
          done < /tmp/changed.txt
          [ "$fail" = "0" ] || exit 1
          echo "docs-gate: markdown OK."

  # T031/B1 (#148 item 7): guarda FAIL-CLOSED para mudanças de banco. O
  # entrypoint do Railway aplica `prisma migrate deploy` no boot de TODO
  # deploy; PR que altera apps/api/prisma/migrations/** ou schema.prisma
  # exige label `migration-review` + plano de rollback + declaração de
  # migration na descrição. Falha fechando (metadado ilegível bloqueia).
  # Torná-lo REQUIRED na ruleset de main é decisão do Operador (P011).
  migration-safety:
    name: Migration Safety (B1)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-test do guard (fixtures determinísticas, sem rede)
        run: node scripts/ci/migration-safety.mjs --self-test
      - name: Coleta metadados do PR (via env — sem injeção de shell)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr-body.md
          printf '%s' "$PR_LABELS" > /tmp/pr-labels.json
      - name: Avalia guarda migration-safety
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" > /tmp/pr-files.txt
          node scripts/ci/migration-safety.mjs \
            --files-file /tmp/pr-files.txt \
            --labels-file /tmp/pr-labels.json \
            --body-file /tmp/pr-body.md

  # T234/T299: spec de isolamento RLS com postgres de service (migrate deploy em DB virgem).
  security-rls:
    name: RLS Isolation (T290/T299/T301)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_RLS_TEST: postgresql://postgres@localhost:5432/rls_test
      DATABASE_URL: postgresql://postgres@localhost:5432/rls_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      # T042: mesma razão do job test — o spec importa @prisma/client.
      - name: Prisma generate
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Aplica migrations em DB virgem (T234 - ordem verificada)
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - name: RLS isolation (A=B)
        run: npx vitest run apps/api/tests/security/rls-isolation.e2e.spec.ts

  # Job 1: Lint + Audit (rápido, roda primeiro)
  lint-audit:
    name: Lint & Audit
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Guard de encoding/BOM (D-210 — arquivos críticos de i18n/config)
        run: node --import @swc-node/register/esm-register scripts/check-encoding-bom.ts
      - name: ESLint
        run: npm run lint
      - name: Security Gate bundle scan (T302 - .next/static buildado)
        run: npm run security:gate -- --bundle apps/web/.next/static || npm run security:gate -- --bundle .next/static
      - name: Security Gate (T294 — scan de segredos + NEXT_PUBLIC)
        run: npm run security:gate
      - name: npm audit (T9.2 — bloqueia merge se houver high/critical)
        # T039/D-462 (P009): exceção cirúrgica e governada só para
        # GHSA-ggr8-5vv4-36mx (deepmerge-ts via CLI prisma, dev-time) —
        # ver package.json → config.auditAllowlist e o runbook T033
        # (revisão trimestral, primeira em 2026-12). Demais HIGHs bloqueiam.
        run: npm run audit:ci

  # Job 2: Testes + Coverage (paralelo com lint)
  test:
    name: Test & Coverage
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      # T042: gera o Prisma Client (sem este step, @prisma/client chega
      # não-inicializado no job fresco e toda suíte que toca o DB falha).
      - name: Prisma generate
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: API tests with coverage
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          SKIP_DB_CONNECT: "true"
        run: npx vitest run --coverage
      - name: Web tests
        working-directory: apps/web
        run: npx vitest run
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/api/coverage/
          retention-days: 30

  # Job 3: Build (paralelo com testes)
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      # T042: gera o Prisma Client explícito (o postinstall do @prisma/client
      # gera um stub oco sem --schema → tsc falha com TS2694/TS2305/TS7006 em
      # cascata; mesma causa raiz dos jobs test/RLS).
      - name: Prisma generate
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Build API
        working-directory: apps/api
        run: npx tsc -p tsconfig.json --noEmit
      - name: Build Web (Next.js)
        working-directory: apps/web
        run: npx next build
      # T452: upload de sourcemaps para o Sentry (release = commit). Opcional:
      # só roda quando o Operador configura SENTRY_PROJECT (vars) e o secret
      # SENTRY_AUTH_TOKEN. Sem eles, é no-op. (`vars` é válido em `if`;
      # `secrets` não — por isso o gate é pela var, não pelo secret.)
      - name: Sentry sourcemaps (T452, opcional)
        if: ${{ vars.SENTRY_PROJECT != '' }}
        working-directory: apps/web
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: npx @sentry/cli sourcemaps upload --release "${{ github.sha }}" .next
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next/
          retention-days: 7

  # Job 4: SAST Semgrep OSS (paralelo) — T045/D-490: substitui o CodeQL.
  # CodeQL desativado: repo privado sem GHAS (D-490/T044) — o upload de
  # results do analyze falha com "Resource not accessible by integration" e
  # nada na branch pode corrigir. Semgrep OSS (gratuito) mantém SAST
  # bloqueante (OWASP Top 10 + security audit, config p/ci): finding
  # high/critical quebra o job; achado real nunca é silenciado.
  semgrep-sast:
    name: Semgrep (SAST)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: p/ci

  # Job 4.5 (T454/D-507): build OpenNext p/ Cloudflare — INFORMATIVO
  # (continue-on-error) até decisão registrada de promovê-lo a requerido
  # (após rollout ≥50%). Não faz deploy: só prova que o artefato worker
  # continua sendo gerado conforme o código muda.
  build-cf-info:
    name: Build OpenNext (CF, informativo)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Build OpenNext (artefato worker)
        working-directory: apps/web
        run: npm run build:cf

  # Job 5: DAST ZAP baseline (apenas em PR)
  zap-baseline:
    name: ZAP Baseline (DAST)
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # T043: permissions mínimas (P012 repo read+write verificado) — cobre a
    # criação de issue ("Resource not accessible"). D-472 (D-486 citado no
    # spec não existe no DECISOES.md; usa-se D-472 verificado).
    # T451: `actions: write` é exigido pelo upload de artefato interno do
    # zaproxy/action-baseline (sem ele: "Create Artifact Container failed:
    # The artifact name zap_scan is not valid" — falha de infra, não do scan).
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      # T042: o alvo anterior (preview-<n>.media-rate.example.com) nunca
      # resolveu (host fictício) — o job falhava 100%. A integração Vercel↔
      # GitHub publica o preview como
      # media-rate-git-<branch-com-tracos>-end-art-studios.vercel.app
      # (ver comentário do vercel[bot] no PR). Sem secret nova.
      # Residual: se o deploy de preview ainda não terminou, o ZAP falha —
      # re-executar o job resolve (não silenciar: DAST real tem valor).
      - name: Resolve Vercel preview URL
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          BRANCH: ${{ github.head_ref }}
        run: |
          # D-530: o rótulo DNS do preview tem limite de 63 chars — nomes de
          # branch longos truncam a URL construída e ela deixa de resolver.
          # Consulta a API do Vercel pelo deployment READY mais recente da
          # branch; fallback: URL construída (comportamento anterior).
          slug="${BRANCH//\//-}"
          construida="https://media-rate-git-${slug}-end-art-studios.vercel.app"
          url_real=""
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            RESP=$(curl -s "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=preview&state=READY&limit=20" -H "Authorization: Bearer $VERCEL_TOKEN")
            url_real=$(printf '%s' "$RESP" | node -e '
              let d = "";
              process.stdin.on("data", (c) => (d += c));
              process.stdin.on("end", () => {
                try {
                  const deps = JSON.parse(d).deployments ?? [];
                  const alvo = deps.find((x) => (x.meta?.githubCommitRef ?? "") === process.env.BRANCH);
                  if (alvo) console.log("https://" + alvo.url);
                } catch {}
              });
            ' BRANCH="$BRANCH")
          fi
          FINAL="${url_real:-$construida}"
          echo "url=$FINAL" >> "$GITHUB_OUTPUT"
          echo "preview resolvido: $FINAL"
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ steps.preview.outputs.url }}
          # T043/D-472: -I ignora WARN-NEW (baseline era FAIL com 15 WARNs e
          # 0 FAILs); falhas reais (high/FAIL) continuam bloqueando. WARNs
          # entram na revisão trimestral 2026-12 (runbook). Sem silenciar.
          cmd_options: "-a -j -I"
          fail_action: true
          issue_title: "OWASP ZAP: Vulnerabilities in ${{ github.event.pull_request.head.sha }}"

  # Job 6: Stryker mutation testing (opcional, não bloqueia)
  stryker:
    name: Stryker Mutation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Stryker run
        working-directory: apps/api
        run: npx stryker run
        continue-on-error: true
      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: apps/api/reports/mutation/
          retention-days: 30

  # Job 7: E2E Playwright (T023/8.3 — nao bloqueia merge ainda)
  e2e:
    name: E2E Playwright
    runs-on: ubuntu-latest
    needs: [build]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: "http://localhost:3000/pt-BR"
        # T461 (D-492): job web-only (sem API/DB) — roda a allowlist curada
        # de specs que são significativos sem backend. A suíte completa exige
        # E2E_FULL=1 com API+DB (ver apps/web/docs → docs/E2E.md); o corpus
        # restante (t103–t161, fluxos, a11y) fica pulado com justificativa.
        run: npx playwright test e2e/auth.spec.ts e2e/navigation.spec.ts --project=chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30

  # T061/D-548: E2E FULL efêmero (Postgres+Redis locais) da jornada crítica,
  # 3 repetições (workers=1, retries=0). NÃO bloqueia merge (continue-on-error),
  # roda só quando a infra de E2E/evidence/CI muda. Sem segredos de produção.
  e2e-full-jornada:
    name: E2E Full (jornada crítica 3x)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    continue-on-error: true
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: e2e_full
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      APP_ENV: test
      DATABASE_URL: postgresql://postgres@localhost:5432/e2e_full
      REDIS_URL: redis://localhost:6379
      COOKIE_SECRET: e2e-full-cookie
      JWT_SECRET: e2e-full-jwt
      SESSION_SECRET: e2e-full-session
      ADMIN_TOKEN: e2e-full-admin
      SESSION_TTL_HOURS: "24"
      CORS_ORIGIN: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SITE_URL: http://localhost:3000
      API_PROXY_TARGET: http://localhost:4000
      E2E_API_BASE: http://localhost:4000
      E2E_TEST_EMAIL: free@mediarate.test
      E2E_TEST_PASSWORD: "Senha@123"
      # T074: limites de rate limit elevados APENAS no ambiente efêmero de teste
      # (a suíte faz centenas de requisições legítimas; não é override de produto).
      RATE_LIMIT_API_PER_MIN: "100000"
      RATE_LIMIT_LOGIN_PER_MIN: "1000"
      E2E_FULL: "1"
      LOG_LEVEL: debug
      PLAYWRIGHT_BASE_URL: http://localhost:3000/pt-BR
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Guarda anti-produção (self-test)
        run: node scripts/ci/evidence-guard.self-test.mjs
      - name: Prisma generate + migrate deploy (DB LOCAL efêmero)
        run: |
          npx prisma generate --schema apps/api/prisma/schema.prisma
          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - name: Provisionar usuários de teste + fixture
        run: |
          npm run db:provision:test-users --workspace=apps/api
          node apps/api/prisma/fixtures/evidence-fixture.cjs
      - name: Subir API (background)
        run: |
          nohup npm run dev --workspace=apps/api > /tmp/api.log 2>&1 &
          echo "api started"
      - name: Esperar API
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4000/api/v1/interacoes || true)
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then echo "API up ($code)"; exit 0; fi
            sleep 2
          done
          echo "API não subiu"; tail -60 /tmp/api.log; exit 1
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Subir web (background)
        run: |
          nohup npm run dev --workspace=apps/web > /tmp/web.log 2>&1 &
          echo "web started"
      - name: Preflight (api + web + login + /auth/me)
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:4000/health >/dev/null 2>&1 && break; sleep 2
          done
          curl -sf http://localhost:4000/health >/dev/null || { echo "API down"; exit 1; }
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/pt-BR >/dev/null 2>&1 && break; sleep 2
          done
          curl -sf http://localhost:3000/pt-BR >/dev/null || { echo "web down"; exit 1; }
          curl -s -c /tmp/pf.jar -o /dev/null -w "preflight_login=%{http_code}\n" \
            -X POST http://localhost:4000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${E2E_TEST_EMAIL}\",\"password\":\"${E2E_TEST_PASSWORD}\"}"
          code=$(curl -s -b /tmp/pf.jar -o /dev/null -w "%{http_code}" http://localhost:4000/api/v1/auth/me)
          echo "preflight_authme=$code"
          [ "$code" = "200" ] || { echo "PREFLIGHT FAIL: /auth/me != 200"; exit 1; }
      - name: E2E jornada crítica 3x (workers=1, retries=0)
        working-directory: apps/web
        run: |
          npx playwright test e2e/jornada-critica.spec.ts \
            --project=chromium --project=mobile-chrome \
            --workers=1 --retries=0 --repeat-each=3
      - name: Upload Playwright report (E2E FULL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: apps/web/playwright-report/
          retention-days: 14
      - name: Sanitizar logs + resumo de evidência
        if: always()
        run: |
          node scripts/ci/sanitize-logs.mjs /tmp/api.log /tmp/web.log || true
          find apps/web/test-results -type f \( -name '*.md' -o -name '*.txt' \) -exec node scripts/ci/sanitize-logs.mjs {} + 2>/dev/null || true
          # T074: storageState contém cookies de sessão — nunca publicar.
          rm -f /tmp/mediarate-e2e-auth.json 2>/dev/null || true
          node -e "const fs=require('fs');let f=[];try{f=fs.readdirSync('apps/web/test-results')}catch{};fs.writeFileSync('evidence-summary.json',JSON.stringify({job:'e2e-full-jornada',falhasArquivos:f.slice(0,50)},null,2))" || true
      - name: Upload logs sanitizados + resumo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-logs
          path: |
            /tmp/api.log
            /tmp/web.log
            evidence-summary.json
            apps/web/test-results/**
          retention-days: 7
          if-no-files-found: ignore

