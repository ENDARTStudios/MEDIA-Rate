# GitHub Actions CI â€” MEDIA Rate (T9.1/T9.2/T8.3/T8.4/T8.5)
#
# Pipeline com stages paralelos: lint+audit | test+coverage | build | CodeQL | ZAP | Stryker
# Cache de npm para acelerar builds subsequentes.
# Artefatos: coverage report, build output, test results.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

env:
  NODE_VERSION: "20"

jobs:
  # Job 1: Lint + Audit (rÃ¡pido, roda primeiro)
  lint-audit:
    name: Lint & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Guard de encoding/BOM (D-210 â€” arquivos crÃ­ticos de i18n/config)
        run: node --import @swc-node/register/esm-register scripts/check-encoding-bom.ts
      - name: ESLint
        run: npm run lint
      - name: npm audit (T9.2 â€” bloqueia merge se houver high/critical)
        run: npm audit --audit-level=high

  # Job 2: Testes + Coverage (paralelo com lint)
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: API tests with coverage
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          SKIP_DB_CONNECT: "true"
        run: npx vitest run --coverage
      - name: Web tests
        working-directory: apps/web
        run: npx vitest run
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/api/coverage/
          retention-days: 30

  # Job 3: Build (paralelo com testes)
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Build API
        working-directory: apps/api
        run: npx tsc -p tsconfig.json --noEmit
      - name: Build Web (Next.js)
        working-directory: apps/web
        run: npx next build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next/
          retention-days: 7

  # Job 4: SAST CodeQL (paralelo)
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  # Job 5: DAST ZAP baseline (apenas em PR)
  zap-baseline:
    name: ZAP Baseline (DAST)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.13.0
        with:
          target: "https://preview-${{ github.event.pull_request.number }}.media-rate.example.com"
          cmd_options: "-a -j"
          fail_action: true
          issue_title: "OWASP ZAP: Vulnerabilities in ${{ github.event.pull_request.head.sha }}"

  # Job 6: Stryker mutation testing (opcional, nÃ£o bloqueia)
  stryker:
    name: Stryker Mutation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Stryker run
        working-directory: apps/api
        run: npx stryker run
        continue-on-error: true
      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: apps/api/reports/mutation/
          retention-days: 30

  # Job 7: E2E Playwright (T023/8.3 â€” nao bloqueia merge ainda)
  e2e:
    name: E2E Playwright
    runs-on: ubuntu-latest
    needs: [build]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: "http://localhost:3000/pt-BR"
        run: npx playwright test --project=chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30

  # T299/D-285: rls-isolation.e2e.spec (A?B sob RLS) — habilitar em CI quando a T234 (ordem de migrations em DB virgem) for fechada; até lá, drill docker documentado em docs/ROLLBACK_RLS.md é a verificação.
