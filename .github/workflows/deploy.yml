# Deploy workflow — MEDIA Rate (T9.2/T9.3 · D-527)
#
# PROMOÇÃO PARA PRODUÇÃO EM PUSH PARA `main`:
# - Frontend: Vercel — integração Git nativa (deploy atômico por push em main).
# - Backend: Railway — integração Git nativa (rolling update por push em main).
# - Database: migrations aplicadas pelo ENTRYPOINT do container da API no boot
#   do deploy (apps/api/docker-entrypoint.sh → `prisma migrate deploy`),
#   ANTES de o servidor começar a aceitar tráfego. Confirmado nos logs do
#   Railway ("[entrypoint] running prisma migrate deploy").
#
# Este workflow NÃO precisa (nem tenta) executar migration: o secret
# DATABASE_URL do GitHub aponta para o hostname INTERNO do Railway, que não é
# alcançável dos runners — por isso o antigo job "Database Migration" falhava
# sempre e foi movido para `migrate-production.yml` (manual, D-527).
#
# O que resta aqui: gate de validação da `main` + health check pós-promoção.
#
# Segredos NUNCA em arquivo — sempre em GitHub Secrets (Seção 8 do PROTOCOLO_MESTRE.md).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # vitest 5 exige Node ^22.12.0 || ^24.0.0.
  NODE_VERSION: "22"

jobs:
  # Job 1: Validação (lint + typecheck + test + audit na main)
  #
  # Esta validação NÃO pede aprovação. Até 2026-10-20 ela carregava
  # `environment: Production` e o efeito era um run "waiting" a cada merge:
  # cinco dos seis últimos runs de Deploy foram cancelados exatamente ali,
  # sem nunca validar nada. Agora quem pede aprovação é o job
  # `deploy-production`, que verifica produção DEPOIS que ela sobe.
  validate:
    name: Validate (lint + test + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Lint (changed files only)
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' 2>/dev/null || true)
          if [ -n "$CHANGED" ]; then
            echo "Lintando arquivos alterados:"
            echo "$CHANGED"
            npx eslint $CHANGED --max-warnings=0 \
              || echo "::warning::Lint encontrou problemas nos arquivos alterados"
          else
            echo "Nenhum arquivo TS/JS alterado — lint pulado."
          fi
      # T461 (D-492): sem o generate, o @prisma/client chega como stub e o
      # typecheck da API falha com TS2694 (AuditLogCreateInput etc.) — mesma
      # razão dos steps "Prisma generate" do ci.yml (T042).
      - name: Prisma generate
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Typecheck API
        working-directory: apps/api
        run: npm run typecheck
      - name: Typecheck Web
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: API tests
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          SKIP_DB_CONNECT: "true"
        run: npx vitest run
      - name: Audit (report-only)
        run: |
          npm audit --audit-level=high \
            || echo "::warning::npm audit reportou vulnerabilidades pré-existentes em deps do Next.js (postcss/sharp — sem fix não-breaking)"
      - name: Build Web
        working-directory: apps/web
        run: npx next build

  # Job 2: P012 — verificação de produção, com aprovação humana.
  #
  # O QUE ESTE GATE FAZ: só roda depois da aprovação no environment `Production`
  # e, então, **verifica a produção de verdade** (API `/health`, web canônica e a
  # rota do catálogo). Se produção não estiver saudável, o run fica VERMELHO —
  # é isso que a aprovação libera e o que ela pode barrar.
  #
  # O QUE ELE NÃO FAZ (honestidade que já estava no comentário anterior e continua
  # valendo): o deploy NATIVO (Railway/Vercel) é disparado pelo push em `main` e
  # roda em paralelo, com janela própria. Aprovar aqui não autoriza nem impede o
  # deploy — trava pré-deploy de verdade exigiria staging (P012, Opção B).
  #
  # Consequência prática: a aprovação deve ser dada DEPOIS que o deploy nativo
  # termina (Railway ~1-2 min, Vercel ~2-3 min). Antes disso o job espera até
  # 5 min pela API e falha se ela não responder — que é o comportamento correto:
  # produção não verificada não vira run verde.
  deploy-production:
    name: Verify production (P012)
    runs-on: ubuntu-latest
    needs: [validate]
    environment: Production
    steps:
      - name: API /health (espera até 5 min pelo deploy do Railway)
        run: |
          for i in $(seq 1 20); do
            sleep 15
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://media-rate-production.up.railway.app/health || echo "000")
            if [ "$RESPONSE" = "200" ]; then
              echo "API /health OK (200) após $((i * 15))s."
              exit 0
            fi
            echo "tentativa $i: $RESPONSE"
          done
          echo "::error::API /health não respondeu 200 em 5 min — produção NÃO foi verificada. Checar Railway."
          exit 1
      - name: Web canônica responde
        run: |
          # Domínio canônico do produto (o alias antigo media-rate-web.vercel.app
          # respondia 200 e mascarava erro; a verificação passou a usar o domínio
          # que o usuário acessa).
          RESPONSE=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 20 https://mediarate.app/pt-BR || echo "000")
          if [ "$RESPONSE" != "200" ]; then
            echo "::error::Web (mediarate.app) respondeu $RESPONSE — deploy do Vercel não promoveu."
            exit 1
          fi
          echo "Web OK (200)."
      - name: Rota do catálogo responde
        run: |
          RESPONSE=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 20 https://mediarate.app/pt-BR/catalog || echo "000")
          if [ "$RESPONSE" != "200" ]; then
            echo "::error::/pt-BR/catalog respondeu $RESPONSE — a rota mais pesada do site não está saudável."
            exit 1
          fi
          echo "Catálogo OK (200)."
