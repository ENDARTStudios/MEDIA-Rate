name: Auto-create PR from feature branch

# T353 (D-321): criava PR automaticamente quando uma branch feature/* era pushada.
# O Operador nunca precisava clicar em URLs — a PR aparecia sozinha.
# Usa o GITHUB_TOKEN nativo (permissões mínimas).
#
# Exceção (D-317): branches chore/* NÃO viram PR (push direto de reconciliação).
#
# T046: o YAML era INVÁLIDO — o heredoc do `run: |` tinha o corpo em coluna 0,
# encerrando o block scalar; o GitHub registrava o workflow sem `name` e criava
# um run SEM JOBS que falhava em ~0s em TODO push.
# T047/D-541: o YAML foi corrigido, mas o disparo fica MANUAL por padrão.
#   NÃO reativamos automação que estava inerte sem decisão do Operador (evita
#   criar PRs automaticamente). Reconectar o push de feature/** = P016.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Create PR (if not exists)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR (idempotente)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF#refs/heads/}"
          BASE="main"

          # Idempotência: não cria duplicata se já houver PR aberta.
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length' || echo "0")
          if [ "$EXISTING" -gt 0 ]; then
            echo "PR já existe para $BRANCH — pulando."
            exit 0
          fi

          # Título = assunto do último commit (conventional commit).
          TITLE=$(git log -1 --pretty=%s)

          # Número da tarefa extraído do nome da branch (feature/T351-... → 351).
          TASK_ID=$(echo "$BRANCH" | sed -E 's/^feature\///; s/-.*//')

          # Corpo padrão com menção à issue (se existir, o número é o ID da tarefa).
          # T046: construir o corpo com printf mantém TODO o block scalar indentado.
          # O heredoc anterior tinha o corpo em coluna 0, o que encerrava o
          # `run: |` e tornava o YAML INVÁLIDO — o GitHub não parseava o
          # workflow (name = path) e falhava em 0s sem jobs em todo push.
          BODY=$(printf 'Closes #%s\n\n## Descrição\n<!-- gerado automaticamente a partir de %s -->\n\n## Evidência\n- [ ] Testes verdes\n- [ ] Lint + typecheck verdes\n\n> PR criada automaticamente pelo workflow create-pr-from-branch.yml (T353/D-321).\n' "$TASK_ID" "$BRANCH")

          gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "$BODY"
          echo "PR criada para $BRANCH → $BASE"
