# ============================================================
# T219 — Regras de supressão do ZAP Baseline Scan (DAST).
# Formato (zaproxy/action-baseline):
#   <scan_id> <regex_url> <nome_do_achado> [notused] [notused]
# Scan IDs comuns (OWASP ZAP):
#   10020/10021  X-Frame-Options / X-Content-Type-Options
#   10027        X-AspNet-Version / server header
#   10038        Content Security Policy header
#   10054        Cookie without SameSite
#   10055        CSP: wildcard
#   10096        Timestamp Disclosure
#   90022        X-Frame-Options header
#
# Regras abaixo são false positives CONHECIDOS do baseline em API/SPA:
# - CSP (10038): a API aplica CSP via helmet em produção; o baseline local
#   (dev, sem helmet) dispara — suprimir apenas para o alvo localhost.
# - Timestamp Disclosure (10096): timestamps ISO em respostas JSON são
#   parte do contrato da API (não são informações sensíveis).
# - X-Frame-Options (10020): API responde JSON; não embutível. Se o alvo
#   final exibir CSP com frame-ancestors, pode ser removida.
# ============================================================

# Apenas dev local (baseline sem helmet):
10038 http://localhost:4000/.* Content Security Policy (CSP) Header Not Set
10038 http://127.0.0.1:4000/.* Content Security Policy (CSP) Header Not Set

# Timestamps ISO são parte do contrato JSON da API:
10096 http://localhost:4000/.* Timestamp Disclosure - Unix
10096 http://127.0.0.1:4000/.* Timestamp Disclosure - Unix

# API sem formulários de upload de arquivos públicos (não embutível):
10020 http://localhost:4000/.* X-Frame-Options Header Not Set
10020 http://127.0.0.1:4000/.* X-Frame-Options Header Not Set
