name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build backend Docker image
        run: docker build -t ghcr.io/mediarate/backend:${{ github.ref_name }} -f infra/docker/backend.Dockerfile .
      - name: Build frontend Docker image
        run: docker build -t ghcr.io/mediarate/frontend:${{ github.ref_name }} -f infra/docker/frontend.Dockerfile .
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push images
        run: |
          docker push ghcr.io/mediarate/backend:${{ github.ref_name }}
          docker push ghcr.io/mediarate/frontend:${{ github.ref_name }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            apps/backend/openapi.json
            checksums.sha256
